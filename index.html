<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Patota Vira Copo's</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { 
            box-sizing: border-box; 
            /* Desativa gestos de zoom por duplo toque em toda a página */
            touch-action: manipulation; 
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            background: #000; 
            color: #fff; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            max-width: 500px;
            margin: 0 auto;
        }

        header { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative; 
            padding: 2px 0; 
        }
        h1 { margin: 0; font-size: 18px; font-weight: bold; }
        #menu { position: absolute; right: 10px; font-size: 22px; cursor: pointer; padding: 5px; }
        
        #horaAtual { text-align: center; font-size: 11px; opacity: 0.7; margin-top: 2px; }
        #cronometro { text-align: center; font-size: 18px; font-weight: bold; margin-top: 2px; }
        
        #cardPlacar { 
            margin: 6px 0; 
            background: #111; 
            border-radius: 12px; 
            padding: 8px 0; 
            text-align: center; 
        }
        #placar { font-size: 44px; font-weight: bold; line-height: 1; }
        #placar span { display: inline-block; min-width: 45px; }
        
        #controle { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold; 
            background: #2d8cf0; 
            border: none; 
            border-radius: 8px; 
            color: #fff; 
            cursor: pointer;
            margin-bottom: 12px;
            touch-action: manipulation;
        }

        /* Layout das Colunas */
        .times-container {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .coluna-time {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #111;
            padding: 10px;
            border-radius: 12px;
        }

        .tituloTime { 
            text-align: center; 
            font-weight: bold; 
            font-size: 14px;
            padding-bottom: 6px;
            border-bottom: 1px solid #222;
        }
        .amareloTitulo { color: #ffd600; }
        .azulTitulo { color: #00c8ff; }

        /* Botões com bloqueio de zoom e alta resposta ao toque */
        .botao { 
            width: 100%; 
            height: 95px; 
            font-size: 18px; 
            font-weight: bold; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* Bloqueia zoom duplo clique */
        }
        
        .gol { background: #00c853; color: #000; }
        .lance { background: #ff9800; color: #000; }
        .falta { background: #ff3b30; color: #fff; }

        .botao:active, #controle:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        #menuBox { 
            display: none; 
            position: absolute; 
            right: 15px; 
            top: 45px; 
            background: #1a1a1a; 
            border: 1px solid #333; 
            border-radius: 8px; 
            padding: 8px; 
            z-index: 100; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #menuBox button { 
            display: block; 
            width: 100%; 
            background: #222; 
            color: #fff; 
            border: none; 
            padding: 10px 14px; 
            margin: 4px 0; 
            border-radius: 4px; 
            text-align: left; 
            cursor: pointer; 
            font-size: 14px;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Patota Vira Copo's</h1>
        <div id="menu">⋮</div>
    </header>

    <div id="horaAtual"></div>
    <div id="cronometro">00:00:00</div>

    <div id="cardPlacar">
        <div id="placar">
            <span id="a" style="color:#ffd600;">0</span>
            <span style="font-size:22px;opacity:0.6;">x</span>
            <span id="b" style="color:#00c8ff;">0</span>
        </div>
    </div>

    <button id="controle" onclick="toggle()">INICIAR JOGO</button>

    <div class="times-container">
        <!-- Coluna Amarela -->
        <div class="coluna-time">
            <div class="tituloTime amareloTitulo">🟡 AMARELO</div>
            <button class="botao gol" onclick="gol('Amarelo')">GOL</button>
            <button class="botao lance" onclick="evento('Lance','Amarelo')">LANCE</button>
            <button class="botao falta" onclick="evento('Falta','Amarelo')">FALTA</button>
        </div>

        <!-- Coluna Azul -->
        <div class="coluna-time">
            <div class="tituloTime azulTitulo">🔵 AZUL</div>
            <button class="botao gol" onclick="gol('Azul')">GOL</button>
            <button class="botao lance" onclick="evento('Lance','Azul')">LANCE</button>
            <button class="botao falta" onclick="evento('Falta','Azul')">FALTA</button>
        </div>
    </div>
</div>

<div id="menuBox">
    <button onclick="enviarWhatsApp()">Enviar WhatsApp 🟢</button>
    <button onclick="voltarGol()">Anular Último Gol</button>
</div>

<script>
let amarelo = 0, azul = 0;
let jogando = false;
let inicio = null;
let relatorio = [];
let ultimoGol = null;
let timer;
let wakeLock = null;
let audioCtx = null;

function tocarSomClick(frequencia = 600, duracao = 0.08) {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequencia, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duracao);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duracao);
    } catch (e) {
        console.error(e);
    }
}

function feedbackClique(tipo) {
    // Tenta reproduzir o som sintetizado
    if (tipo === 'gol') {
        tocarSomClick(800, 0.15);
    } else if (tipo === 'falta') {
        tocarSomClick(350, 0.12);
    } else {
        tocarSomClick(600, 0.08);
    }

    // Vibração via Hardware (Funciona no Silencioso no Android)
    if ('vibrate' in navigator) {
        try {
            if (tipo === 'gol') {
                navigator.vibrate([120, 60, 120]); // Vibração dupla marcante para gol
            } else if (tipo === 'falta') {
                navigator.vibrate([200]); // Vibração longa para falta
            } else {
                navigator.vibrate(70); // Vibração curta padrão
            }
        } catch(e) {
            console.log("Vibração não permitida ou não suportada no dispositivo.");
        }
    }
}

async function solicitarWakeLock() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {
        console.error(`${err.name}, ${err.message}`);
    }
}

function liberarWakeLock() {
    if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
    }
}

function atualizarHora() {
    document.getElementById("horaAtual").innerText = new Date().toLocaleTimeString();
}
setInterval(atualizarHora, 1000);
atualizarHora();

document.getElementById("menu").onclick = function() {
    feedbackClique('click');
    let box = document.getElementById("menuBox");
    box.style.display = box.style.display === "block" ? "none" : "block";
}

function atualizarPlacar() {
    document.getElementById("a").innerText = amarelo;
    document.getElementById("b").innerText = azul;
}

function agora() { return new Date().toLocaleTimeString(); }

function getNomeTimeColorido(time) {
    return time === "Amarelo" ? "🟡 AMARELO" : "🔵 AZUL";
}

function gol(time) {
    if (!jogando) { alert("Inicie o jogo primeiro!"); return; }
    feedbackClique('gol');
    
    if (time == "Amarelo") { amarelo++; ultimoGol = "Amarelo"; } 
    else { azul++; ultimoGol = "Azul"; }
    
    atualizarPlacar();
    relatorio.push("⚽ [" + agora() + "] GOL - " + getNomeTimeColorido(time) + " (" + amarelo + " x " + azul + ")");
}

function evento(tipo, time) {
    if (!jogando) { alert("Inicie o jogo primeiro!"); return; }
    
    if (tipo === 'Falta') feedbackClique('falta');
    else feedbackClique('click');
    
    let emoji = (tipo === 'Falta') ? "🟥" : "🎯";
    relatorio.push(emoji + " [" + agora() + "] " + tipo + " - " + getNomeTimeColorido(time));
}

function voltarGol() {
    feedbackClique('click');
    if (!ultimoGol) return;
    let timeAnulado = ultimoGol;
    if (ultimoGol == "Amarelo" && amarelo > 0) amarelo--;
    if (ultimoGol == "Azul" && azul > 0) azul--;
    atualizarPlacar();
    relatorio.push("❌ [" + agora() + "] GOL ANULADO - " + getNomeTimeColorido(timeAnulado) + " (" + amarelo + " x " + azul + ")");
    ultimoGol = null;
    document.getElementById("menuBox").style.display = "none";
}

function toggle() {
    feedbackClique('click');
    if (!jogando) {
        solicitarWakeLock();
        inicio = new Date();
        relatorio = [];
        amarelo = 0; azul = 0; 
        atualizarPlacar();
        document.getElementById("cronometro").innerText = "00:00:00";
        
        relatorio.push("==========================");
        relatorio.push("   PATOTA VIRA COPO'S");
        relatorio.push("==========================");
        relatorio.push("DATA: " + inicio.toLocaleString());
        relatorio.push("INÍCIO: " + inicio.toLocaleTimeString());
        relatorio.push("--------------------------");
        
        document.getElementById("controle").innerText = "FINALIZAR JOGO";
        document.getElementById("controle").style.background = "#ff3b30";
        timer = setInterval(crono, 1000);
        jogando = true;
    } else {
        liberarWakeLock();
        let fim = new Date();
        clearInterval(timer);
        
        relatorio.push("--------------------------");
        relatorio.push("FIM: " + fim.toLocaleTimeString());
        relatorio.push("RESULTADO FINAL: 🟡 " + amarelo + " x " + azul + " 🔵");
        
        let vencedor = "EMPATE";
        if (amarelo > azul) vencedor = "🟡 AMARELO 🏆";
        else if (azul > amarelo) vencedor = "🔵 AZUL 🏆";
        relatorio.push("VENCEDOR: " + vencedor);
        relatorio.push("==========================");
        
        document.getElementById("controle").innerText = "INICIAR NOVO JOGO";
        document.getElementById("controle").style.background = "#2d8cf0";
        
        jogando = false;
        alert("Jogo finalizado! O placar final foi " + amarelo + " x " + azul + ". Envie o relatório pelo menu.");
    }
}

function crono() {
    let agoraTime = new Date();
    let diff = new Date(agoraTime - inicio);
    let h = String(diff.getUTCHours()).padStart(2, '0');
    let m = String(diff.getUTCMinutes()).padStart(2, '0');
    let s = String(diff.getUTCSeconds()).padStart(2, '0');
    document.getElementById("cronometro").innerText = h + ":" + m + ":" + s;
}

function enviarWhatsApp() {
    feedbackClique('click');
    if (relatorio.length === 0) {
        alert("Não há dados de jogo para enviar!");
        return;
    }
    const textoRelatorio = relatorio.join("\n");
    const mensagem = encodeURIComponent(textoRelatorio);
    const url = "https://wa.me/?text=" + mensagem;
    window.open(url, "_blank");
    document.getElementById("menuBox").style.display = "none";
}

document.addEventListener('visibilitychange', async () => {
  if (wakeLock !== null && document.visibilityState === 'visible') {
    solicitarWakeLock();
  }
});

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
}
</script>

</body>
</html>
